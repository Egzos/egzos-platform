name: Task
description: A concrete unit of work assigned to one agent queue.
title: ""
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be built, changed, or delivered?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: How will you know this is done? List checkable conditions.
    validations:
      required: true
  - type: dropdown
    id: owner-agent
    attributes:
      label: Owner agent
      description: Which agent will work this task?
      options:
        - a4s-atelier
        - a4g-atelier
        - a6-adversary
        - a9s-landlord
        - a9f-landlord
    validations:
      required: true
  - type: input
    id: phase
    attributes:
      label: Phase
      description: "e.g. 6.1, 6.2, 7.1"
      placeholder: "6.0"
    validations:
      required: true
